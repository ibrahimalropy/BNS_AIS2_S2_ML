name: Deploy projects to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "daily-expense-calculator/**"
      - "My_Project/supermarket/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: https://ibrahimalropy.github.io/BNS_AIS2_S2_ML/
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install expense calculator dependencies
        working-directory: daily-expense-calculator
        run: pnpm install --frozen-lockfile

      - name: Build expense calculator
        working-directory: daily-expense-calculator
        run: pnpm build

      - name: Install supermarket dependencies
        working-directory: My_Project/supermarket
        run: pnpm install --frozen-lockfile

      - name: Build supermarket
        working-directory: My_Project/supermarket
        run: pnpm build

      - name: Assemble Pages site
        run: |
          rm -rf pages-site
          mkdir -p pages-site/supermarket
          cp -a daily-expense-calculator/dist/public/. pages-site/
          cp -a My_Project/supermarket/dist/public/. pages-site/supermarket/
          cat > pages-site/supermarket/README.txt <<'EOF'
          Supermarket project deployed from My_Project/supermarket.
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Add site links to workflow summary
        run: |
          {
            echo "## Published projects"
            echo ""
            echo "- [Daily Expense Calculator](https://ibrahimalropy.github.io/BNS_AIS2_S2_ML/)"
            echo "- [Supermarket Management System](https://ibrahimalropy.github.io/BNS_AIS2_S2_ML/supermarket/)"
            echo "- [Original Manus preview](https://supermarketm-7n6cnzwz.manus.space/)"
          } >> "$GITHUB_STEP_SUMMARY"
